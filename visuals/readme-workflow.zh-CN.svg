<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-label="从任务到交付的工作流"><rect width="960" height="550" rx="16" fill="#f3f0e7"/><g fill="#252a29" font-family="Arial,Microsoft YaHei,sans-serif"><g transform="translate(40,40)"><rect width="400" height="200" rx="12" fill="#fffdf7" stroke="#a6b0a6" stroke-width="2"/><text x="26" y="42" font-size="25" fill="#a83a28">01</text><text x="26" y="111" font-size="50" font-weight="700">理解任务</text><text x="26" y="163" font-size="30">目标、范围与验收</text></g><g transform="translate(520,40)"><rect width="400" height="200" rx="12" fill="#fffdf7" stroke="#a6b0a6" stroke-width="2"/><text x="26" y="42" font-size="25" fill="#a83a28">02</text><text x="26" y="111" font-size="50" font-weight="700">选择方法</text><text x="26" y="163" font-size="30">需要的 Skills 与工具</text></g><g transform="translate(520,310)"><rect width="400" height="200" rx="12" fill="#dde6df" stroke="#a6b0a6" stroke-width="2"/><text x="26" y="42" font-size="25" fill="#a83a28">03</text><text x="26" y="111" font-size="50" font-weight="700">执行和检查</text><text x="26" y="163" font-size="30">看结果，核实并修正</text></g><g transform="translate(40,310)"><rect width="400" height="200" rx="12" fill="#fffdf7" stroke="#a6b0a6" stroke-width="2"/><text x="26" y="42" font-size="25" fill="#a83a28">04</text><text x="26" y="111" font-size="50" font-weight="700">交付和接续</text><text x="26" y="163" font-size="30">成品、依据与下一步</text></g></g><g stroke="#a83a28" stroke-width="5" fill="none"><path d="M456 140h46m-13-11 13 11-13 11"/><path d="M720 256v36m-11-13 11 13 11-13"/><path d="M504 410h-46m13-11-13 11 13 11"/></g></svg>